<!DOCTYPE html>
<html>
<head>
    <title>Live Detection</title>
</head>
<style>
        body {
            display: flex;
            flex-direction: column;  
            justify-content: center; 
            align-items: center;     
            height: 100vh;           
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        img {
            max-width: 500px;   /* reduced size */
            width: 100%;        /* responsive */
            height: auto;
            border: 2px solid #333;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: #007BFF;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
<body>
    <h2>Live Camera Feed</h2>
    <img src="{{ url_for('live_feed') }}" width="720">

    <form action="/analyze_live">
        <button type="submit">Analyze Traffic</button>
    </form>
</body>
</html>
